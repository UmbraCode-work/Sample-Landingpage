<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
    <link rel="icon" type="image/x-icon" href="./assets/images/Ember logo with flame icon.png">
    <title>Sample landing page</title>
</head>
<body>
    <header>
        <nav>
            <button class="menu">&#9776</button>
            <a href="#" class="logo">EMBER</a>
            <ul class="nav-list">
                <li><a href="#">Home</a></li>
                <li><a href="#">Menu</a></li>
                <li><a href="#">Location</a></li>
                <li><a href="#">Contact</a></li>
                <li><a href="#">About</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="hero-left">
                <h1>Food that feels like home</h1>
                <h2>Modern comfort dishes made fresh every day.</h2>
                <a class="cta" href="#menu">View menu</a>
            </div>
            <div class="hero-right">
                <div class="social-proof-1">
                    
                </div>
                <div>
                    <img src="./assets/images/Comfort food feast on rustic table.png" alt="Comfort food feast on rustic table">
                </div>
            </div>
        </section>

        <section class="menu" id="menu">
            <h2>Menu</h2>
            <div class="carousel">
                <div class="group">
                    <div class="card">1</div>
                    <div class="card">2</div>
                    <div class="card">3</div>
                    <div class="card">4</div>
                    <div class="card">5</div>
                    <div class="card">6</div>
                </div>
            </div>
        </section>

        <section class="features">
            <article>
                <h2>Why EMBER?</h2>
                <ol>
                    <li></li>
                    <li></li>
                    <li></li>
                </ol>
            </article>
            

            <section class="social-proof-2">

            </section>

            <section class="more-details">
                <section class="location">

                </section>

                <section class="hour">

                </section>
            </section>

            <a href="#" class="cta">Reserve a table!</a>

        </section>
    </main>

    <footer>
        
    </footer>
</body>
</html>
